# Every property used in mods.toml or neoforge.mods.toml must also be listed
# in the expandProps map of buildSrc/src/main/groovy/multiloader-common.gradle

# Project
version=0.1.0
group=com.manuelaraujo.quantumchest
java_version=25

# Mod
mod_id=quantumchest
mod_name=QuantumChest
mod_author=Manuel Araujo
license=MIT
credits=
description=One chest for everything. Unlimited storage you have to earn, with category tabs, search and upgrades.

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# Vanilla version used to compile the common project
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# NeoForge, https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.101
neoforge_loader_version_range=[1,)

# Forge, https://files.minecraftforge.net/net/minecraftforge/forge/index_26.3.html
forge_version=66.1.5
forge_loader_version_range=[66,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle: put classes and resources in the same output folder so Forge finds the mod in dev runs
net.minecraftforge.gradle.merge-source-sets=true
